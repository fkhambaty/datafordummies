<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- dfd-seo:start -->
    <meta name="description" content="Reset password. Enter your email and we’ll send you a 6-digit code.">
    <link rel="canonical" href="https://datafordummies.in/auth/reset-password.html">
    <meta property="og:title" content="Reset password | Data For Dummies">
    <meta property="og:description" content="Reset password. Enter your email and we’ll send you a 6-digit code.">
    <meta property="og:url" content="https://datafordummies.in/auth/reset-password.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://datafordummies.in/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <!-- dfd-seo:end -->
    <title>Reset password | Data For Dummies</title>
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../css/dfd-system.css">
</head>
<body class="auth-page ds-root">
    <a href="../index.html" class="auth-back-home"><span aria-hidden="true">←</span> Back to home</a>
    <div class="auth-card ds-animate-in">
        <h1>Reset password</h1>
        <p class="auth-subtitle" id="subtitle">Enter your email and we’ll send you a 6-digit code.</p>
        <div id="authError" class="auth-error" style="display:none;"></div>
        <div id="authSuccess" class="auth-success" style="display:none;"></div>
        <form class="auth-form" id="requestForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
            <button type="submit" class="ds-btn ds-btn-primary auth-submit" id="requestBtn">Send code</button>
        </form>
        <form class="auth-form" id="resetForm" style="display:none;">
            <label for="code">6-digit code</label>
            <input type="text" id="code" name="code" required inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="123456" autocomplete="one-time-code">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8" placeholder="Same password again" autocomplete="new-password">
            <button type="submit" class="ds-btn ds-btn-primary auth-submit" id="resetBtn">Set new password</button>
        </form>
        <p class="auth-links">
            <a href="login.html">Back to login</a>
        </p>
    </div>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-auth.js"></script>
    <script>
        (function () {
            var errEl = document.getElementById('authError');
            var successEl = document.getElementById('authSuccess');
            var requestForm = document.getElementById('requestForm');
            var resetForm = document.getElementById('resetForm');
            var emailInput = document.getElementById('email');

            function show(el, text) {
                errEl.style.display = 'none';
                successEl.style.display = 'none';
                el.textContent = text;
                el.style.display = 'block';
            }

            requestForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var btn = document.getElementById('requestBtn');
                btn.disabled = true;
                window.FKTI_Auth.requestPasswordReset(emailInput.value.trim()).then(function (res) {
                    btn.disabled = false;
                    if (res.error) {
                        show(errEl, res.error.message);
                        return;
                    }
                    requestForm.style.display = 'none';
                    resetForm.style.display = 'block';
                    document.getElementById('subtitle').textContent =
                        'If ' + emailInput.value.trim() + ' has an account, a code is on its way. Check spam too.';
                    document.getElementById('code').focus();
                });
            });

            resetForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var password = document.getElementById('password').value;
                if (password !== document.getElementById('confirm').value) {
                    show(errEl, 'The two passwords do not match.');
                    return;
                }
                var btn = document.getElementById('resetBtn');
                btn.disabled = true;
                window.FKTI_Auth.resetPassword(emailInput.value.trim(), document.getElementById('code').value.trim(), password)
                    .then(function (res) {
                        btn.disabled = false;
                        if (res.error) {
                            show(errEl, res.error.message);
                            return;
                        }
                        window.location.href = 'login.html?reset=success';
                    });
            });
        })();
    </script>
    <p>
    </p>
    <p>
        <nav class="dfd-legal" aria-label="Policies">
            <a href="../privacy.html">Privacy</a>
            <a href="../terms.html">Terms</a>
            <a href="../cancellation.html">Cancellation</a>
            <a href="../refunds.html">Refunds</a>
        </nav>
    </p>
</body>
</html>
