<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- dfd-seo:start -->
    <meta name="description" content="Login. Welcome back.">
    <link rel="canonical" href="https://datafordummies.in/auth/login.html">
    <meta property="og:title" content="Login | Data For Dummies">
    <meta property="og:description" content="Login. Welcome back.">
    <meta property="og:url" content="https://datafordummies.in/auth/login.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://datafordummies.in/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <!-- dfd-seo:end -->
    <title>Login | Data For Dummies</title>
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../css/dfd-system.css">
</head>
<body class="auth-page ds-root">
    <a href="../index.html" class="auth-back-home"><span aria-hidden="true">←</span> Back to home</a>
    <div class="auth-card ds-animate-in">
        <h1>Log in</h1>
        <p class="auth-subtitle">Welcome back. Sign in to continue learning.</p>
        <div id="authError" class="auth-error" style="display:none;"></div>
        <div id="authSuccess" class="auth-success" style="display:none;"></div>
        <form class="auth-form" id="loginForm">
            <label for="email">Email or username</label>
            <input type="text" id="email" name="email" required placeholder="you@example.com" autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
            <button type="submit" class="ds-btn ds-btn-primary auth-submit" id="submitBtn">Log in</button>
        </form>
        <div class="auth-divider">or</div>
        <p class="auth-links">
            <a href="signup.html">Create an account</a> · <a href="reset-password.html">Forgot password?</a>
        </p>
    </div>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-auth.js"></script>
    <script>
        var form = document.getElementById('loginForm');
        var errEl = document.getElementById('authError');
        var successEl = document.getElementById('authSuccess');
        var submitBtn = document.getElementById('submitBtn');
        var params = new URLSearchParams(window.location.search);
        if (params.get('reset') === 'success') {
            successEl.textContent = 'Password updated. You can log in with your new password.';
            successEl.style.display = 'block';
        }
        function safeReturn(raw) {
            var fallback = 'profile.html';
            if (!raw) return fallback;
            var authPages = {
                'profile.html': 1,
                'verify.html': 1,
                'reset-password.html': 1,
                'signup.html': 1,
                'update-password.html': 1,
                'confirm.html': 1
            };
            try {
                if (raw.indexOf('://') === -1 && raw.charAt(0) !== '/' && raw.indexOf('..') === -1) {
                    var file = raw.split('?')[0].split('#')[0];
                    if (authPages[file]) return raw;
                    if (/\.html$/.test(file)) return '/' + raw;
                }
                var url = new URL(raw, window.location.origin);
                if (url.origin !== window.location.origin) return fallback;
                if (url.pathname.indexOf('login.html') !== -1) return fallback;
                return url.pathname + url.search + url.hash;
            } catch (err) {
                return fallback;
            }
        }
        var returnTo = safeReturn(params.get('returnTo'));

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errEl.style.display = 'none';
            successEl.style.display = 'none';
            errEl.textContent = '';
            submitBtn.disabled = true;
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                errEl.textContent = 'Please enter email and password.';
                errEl.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            if (!window.FKTI_Auth || !window.FKTI_Auth.signInWithPassword) {
                errEl.textContent = 'Auth not loaded. Refresh the page and try again.';
                errEl.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            window.FKTI_Auth.signInWithPassword(email, password).then(function (res) {
                if (res.error && res.error.needs_verification) {
                    window.location.href = 'verify.html?email=' + encodeURIComponent(res.error.email || email);
                    return;
                }
                if (res.error) {
                    var msg = res.error.message || 'Login failed.';
                    if (msg.indexOf('Invalid login') !== -1 || msg.indexOf('invalid_credentials') !== -1) {
                        msg = 'Invalid email or password. Try again or reset your password.';
                    } else if (msg.indexOf('Email not confirmed') !== -1) {
                        msg = 'Please confirm your email first. Check your inbox for the verification link.';
                    }
                    errEl.textContent = msg;
                    errEl.style.display = 'block';
                    submitBtn.disabled = false;
                    return;
                }
                window.location.href = returnTo;
            }).catch(function (err) {
                errEl.textContent = (err && err.message) || 'Something went wrong. Try again.';
                errEl.style.display = 'block';
                submitBtn.disabled = false;
            });
        });
    </script>
    <footer class="auth-legal">

        <nav class="dfd-legal" aria-label="Policies">
            <a href="../privacy.html">Privacy</a>
            <a href="../terms.html">Terms</a>
            <a href="../cancellation.html">Cancellation</a>
            <a href="../refunds.html">Refunds</a>
            <a href="../shipping.html">Digital delivery</a>
            <a href="../contact.html">Contact</a>
        </nav>
    </footer>
</body>
</html>
