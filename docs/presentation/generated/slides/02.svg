  </text>
        <text x="1102" y="570" fill="#0F172A" font-family="Outfit" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">See real progress</tspan>
  </text>
        <text x="1102" y="650" fill="#536179" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">Saved completion, course progress,</tspan><tspan x="1102" dy="25">and certificates make momentum</tspan><tspan x="1102" dy="25">visible.</tspan>
