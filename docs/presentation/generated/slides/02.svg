    <text x="182" y="74" fill="#4F46E5" font-family="Outfit" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="182" dy="0">WHY THIS PRODUCT</tspan>
  </text>
    <text x="64" y="132" fill="#0F172A" font-family="Outfit" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Learning data should feel</tspan><tspan x="64" dy="56">achievable</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#DDE3ED" stroke-width="2"/>
    <text x="64" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Data For Dummies</tspan>
  </text>
    <text x="1536" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">02</tspan>
  </text>
  
    <text x="64" y="252" fill="#536179" font-family="Arial" font-size="30" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">The app turns a broad, intimidating subject into a clear</tspan><tspan x="64" dy="40">next step—on the device learners already carry.</tspan>
  </text>
    <rect x="64" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="126" cy="495" r="29" fill="#E9E7FF"/>
   <text x="126" y="502.54" fill="#4F46E5" font-family="Outfit" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="126" dy="0">01</tspan>
  </text>
        <text x="102" y="570" fill="#0F172A" font-family="Outfit" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">Start without friction</tspan>
  </text>
        <text x="102" y="650" fill="#536179" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">Browse the course catalogue and</tspan><tspan x="102" dy="25">free lessons before committing.</tspan>
  </text><rect x="564" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="626" cy="495" r="29" fill="#E9E7FF"/>
   <text x="626" y="502.54" fill="#4F46E5" font-family="Outfit" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="626" dy="0">02</tspan>
  </text>
        <text x="602" y="570" fill="#0F172A" font-family="Outfit" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Learn at your pace</tspan>
  </text>
        <text x="602" y="650" fill="#536179" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Read focused lessons, use practical</tspan><tspan x="602" dy="25">tools, and continue where you</tspan><tspan x="602" dy="25">stopped.</tspan>
  </text><rect x="1064" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="1126" cy="495" r="29" fill="#E9E7FF"/>
