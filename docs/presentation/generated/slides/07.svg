<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F7F8FC"/>
    <circle cx="1510" cy="-30" r="245" fill="#4F46E5" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#06B6D4" opacity="0.09"/>
    <rect x="64" y="46" width="224" height="42" rx="21" fill="#E9E7FF"/>
    <text x="176" y="74" fill="#4F46E5" font-family="Outfit" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="176" dy="0">TRUST BY DESIGN</tspan>
  </text>
    <text x="64" y="132" fill="#0F172A" font-family="Outfit" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">The app protects the learner’s</tspan><tspan x="64" dy="56">context</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#DDE3ED" stroke-width="2"/>
    <text x="64" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Data For Dummies</tspan>
  </text>
    <text x="1536" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">07</tspan>
  </text>
  
    <text x="64" y="220" fill="#536179" font-family="Arial" font-size="25" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Native boundaries are strict where identity and navigation matter most; web</tspan><tspan x="64" dy="34">content is admitted only on purpose.</tspan>
  </text>
    <rect x="64" y="315" width="714" height="194" rx="24" fill="#E9E7FF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="118" cy="371" r="27" fill="#4F46E5"/>
   <text x="118" y="378.02" fill="#FFFFFF" font-family="Outfit" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="118" dy="0">S</tspan>
  </text>
        <text x="164" y="378" fill="#0F172A" font-family="Outfit" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="164" dy="0">Secure sessions</tspan>
  </text>
        
          <circle cx="176" cy="418" r="4" fill="#4F46E5"/>
          <text x="192" y="424" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Tokens stored in secure device storage</tspan>
  </text>
        
          <circle cx="176" cy="448" r="4" fill="#4F46E5"/>
          <text x="192" y="454" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Session refresh and expiry handling</tspan>
  </text>
        
          <circle cx="176" cy="478" r="4" fill="#4F46E5"/>
          <text x="192" y="484" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Sensitive state cleared on sign out</tspan>
  </text>
        <rect x="808" y="315" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="862" cy="371" r="27" fill="#E9E7FF"/>
   <text x="862" y="378.02" fill="#4F46E5" font-family="Outfit" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="862" dy="0">W</tspan>
  </text>
        <text x="908" y="378" fill="#0F172A" font-family="Outfit" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="908" dy="0">Hardened WebView</tspan>
  </text>
        
          <circle cx="920" cy="418" r="4" fill="#4F46E5"/>
          <text x="936" y="424" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Allowlisted lesson and tool routes</tspan>
  </text>
        
          <circle cx="920" cy="448" r="4" fill="#4F46E5"/>
          <text x="936" y="454" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Unexpected navigation is blocked</tspan>
  </text>
        
          <circle cx="920" cy="478" r="4" fill="#4F46E5"/>
          <text x="936" y="484" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">External URLs open outside the app</tspan>
  </text>
        <rect x="64" y="539" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="118" cy="595" r="27" fill="#E9E7FF"/>
   <text x="118" y="602.02" fill="#4F46E5" font-family="Outfit" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="118" dy="0">P</tspan>
  </text>
        <text x="164" y="602" fill="#0F172A" font-family="Outfit" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="164" dy="0">Privacy controls</tspan>
  </text>
        
          <circle cx="176" cy="642" r="4" fill="#4F46E5"/>
          <text x="192" y="648" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">No invented social or tracking claims</tspan>
  </text>
        
          <circle cx="176" cy="672" r="4" fill="#4F46E5"/>
          <text x="192" y="678" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Account deletion available</tspan>
  </text>
        
          <circle cx="176" cy="702" r="4" fill="#4F46E5"/>
          <text x="192" y="708" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Legal pages remain reachable</tspan>
  </text>
        <rect x="808" y="539" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
        <circle cx="862" cy="595" r="27" fill="#E9E7FF"/>
   <text x="862" y="602.02" fill="#4F46E5" font-family="Outfit" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="862" dy="0">A</tspan>
  </text>
        <text x="908" y="602" fill="#0F172A" font-family="Outfit" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="908" dy="0">Accessible interaction</tspan>
  </text>
        
          <circle cx="920" cy="642" r="4" fill="#4F46E5"/>
          <text x="936" y="648" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Readable contrast and type scale</tspan>
  </text>
        
          <circle cx="920" cy="672" r="4" fill="#4F46E5"/>
          <text x="936" y="678" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Touch-friendly controls</tspan>
  </text>
        
          <circle cx="920" cy="702" r="4" fill="#4F46E5"/>
          <text x="936" y="708" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Predictable bottom navigation</tspan>
  </text>
        
  
  </svg>