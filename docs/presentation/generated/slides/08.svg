    <text x="200" y="74" fill="#4F46E5" font-family="Outfit" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="200" dy="0">MOBILE ARCHITECTURE</tspan>
  </text>
    <text x="64" y="132" fill="#0F172A" font-family="Outfit" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Native where it matters. Reuse</tspan><tspan x="64" dy="56">where it helps.</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#DDE3ED" stroke-width="2"/>
    <text x="64" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Data For Dummies</tspan>
  </text>
    <text x="1536" y="874" fill="#536179" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">08</tspan>
  </text>
  
    <text x="64" y="220" fill="#536179" font-family="Arial" font-size="25" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">A React Native shell delivers app-grade identity, navigation and state while</tspan><tspan x="64" dy="34">selected long-form content remains safely reusable.</tspan>
  </text>
    <rect x="64" y="325" width="330" height="300" rx="24" fill="#E9E7FF" stroke="#DDE3ED" stroke-width="2"/>
    <text x="92" y="370" fill="#0F172A" font-family="Outfit" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">Android + iOS</tspan>
  </text>
    <text x="92" y="407" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">One React Native app with</tspan><tspan x="92" dy="23">platform-specific</tspan><tspan x="92" dy="23">packaging, icons and</tspan><tspan x="92" dy="23">release settings.</tspan>
  </text>
    <rect x="482" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
    <text x="510" y="370" fill="#0F172A" font-family="Outfit" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Native product shell</tspan>
  </text>
    <text x="510" y="407" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Authentication, Home,</tspan><tspan x="510" dy="23">Courses, Progress,</tspan><tspan x="510" dy="23">Certificates, Tools and</tspan><tspan x="510" dy="23">Account.</tspan>
  </text>
    <rect x="900" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
    <text x="928" y="370" fill="#0F172A" font-family="Outfit" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Controlled web content</tspan>
  </text>
    <text x="928" y="407" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Existing lesson and tool</tspan><tspan x="928" dy="23">routes inside an</tspan><tspan x="928" dy="23">allowlisted, hardened</tspan><tspan x="928" dy="23">WebView.</tspan>
  </text>
    <rect x="1318" y="325" width="218" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3ED" stroke-width="2"/>
    <text x="1346" y="370" fill="#0F172A" font-family="Outfit" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">Existing backend</tspan>
  </text>
    <text x="1346" y="407" fill="#536179" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">The same account,</tspan><tspan x="1346" dy="23">content,</tspan><tspan x="1346" dy="23">entitlement and</tspan><tspan x="1346" dy="23">progress services.</tspan>
  </text>
