name: Production smoke

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.55.0
      - name: Install Chromium
        run: "$RUNNER_TEMP/pw/node_modules/.bin/playwright install --with-deps chromium"
      - name: Homepage, health, demo login, and widths
        env:
          REQUIRE_BROWSER: "1"
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.js
        run: node scripts/production_smoke.mjs
